[project]
# 发行包名用 `parallax-framework`：PyPI 上的 `parallax` 已被一个 SSH 批量执行工具占用。
# 导入名仍是 `parallax`（发行名与导入名不同是合法且常见的，如 beautifulsoup4 → bs4）。
name = "parallax-framework"
version = "0.1.0"
description = "Parallax: an anti-conformity multi-agent evidence assembly framework"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "langgraph>=0.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
# 可选：接真实基础设施时才需要装
infra = [
    "redis>=5.0",
    "qdrant-client>=1.12",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "anyio>=4.0",
    "ruff>=0.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.scripts]
parallax = "parallax.cli:main"
parallax-serve = "parallax.service.app:main"

[tool.setuptools.packages.find]
include = ["parallax*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
# 语料是**故意写坏的代码**（植入了缺陷），必须排除，否则每次 lint 都会报几百条。
extend-exclude = [".venv", "eval/corpus", "runs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RET", "PTH"]
ignore = [
    "E501",   # 行长交给 formatter 管
    "B008",   # FastAPI 的 Depends()/Query() 就是要在默认值里调用
    "SIM108", # 三元表达式不总是更清晰
]

[tool.ruff.lint.per-file-ignores]
# 测试里允许用 assert 做断言、允许长函数名
"tests/*" = ["S101", "B011"]

