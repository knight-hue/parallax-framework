# 默认测试档的数据源。
#
# H2 只做单元测试的建表与映射校验，不替代真实 MySQL。
# 测试 schema 在 src/test/resources/db/h2，由 db/mysql 迁移脚本转换而来；
# 真实 MySQL 行为由 MysqlPersistenceIT（显式开启）负责。
spring:
  datasource:
    # MODE=MySQL 让 H2 接受 MySQL 方言的测试 schema。
    # 库名带 random.uuid：不同测试类会用不同的 Spring 上下文，
    # 若共用同一个内存库名，第二个上下文的 Flyway 会因"表已存在"而启动失败。
    url: jdbc:h2:mem:parallax-${random.uuid};MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      # H2 与 MySQL 对某些类型名的大小写处理不同，validate 在 H2 上会误报；
      # 表结构的权威定义是 Flyway 迁移，这里不重复校验。
      ddl-auto: none
  flyway:
    enabled: true
    locations: classpath:db/h2

parallax:
  identity:
    enabled: true
  gateway:
    internal-token: test-internal-token
  webhooks:
    github-secret: test-github-webhook-secret
    gitlab-secret: test-gitlab-webhook-token
