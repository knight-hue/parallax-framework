server:
  port: ${PARALLAX_GATEWAY_PORT:8080}

spring:
  autoconfigure:
    # AMQP starts only with the explicit platform dispatch runtime configuration.
    exclude: org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
  profiles:
    default: mysql
  application:
    name: parallax-gateway
  datasource:
    # 平台能力（身份/配额/账本/运行记录）的存储。
    # Legacy fallback; the default mysql profile provides the platform datasource.
    url: ${PARALLAX_DB_URL:jdbc:postgresql://127.0.0.1:5432/parallax}
    username: ${PARALLAX_DB_USER:parallax}
    password: ${PARALLAX_DB_PASSWORD:parallax}
    hikari:
      # 数据库不可用时快速失败：默认 30s 会让请求一直挂着，健康检查也测不出问题。
      connection-timeout: ${PARALLAX_DB_CONNECTION_TIMEOUT_MS:3000}
      validation-timeout: ${PARALLAX_DB_VALIDATION_TIMEOUT_MS:2000}
  jpa:
    # 表结构由 Flyway 拥有。设为 validate 而不是 update：
    # update 会让"迁移没跑"这件事在开发机上永远发现不了，直到上生产。
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    # ⚠️ 关键配置：一次审查任务的 SSE 流会持续几分钟，
    # 而 Tomcat 的异步请求默认超时是 30 秒——不显式放宽的话，
    # 前端会在第 30 秒莫名其妙地断流，且看不到任何错误。
    async:
      request-timeout: 1800000

parallax:
  dispatch:
    enabled: ${PARALLAX_DISPATCH_ENABLED:false}
    rabbit-uri: ${PARALLAX_RABBIT_URI:}
    worker-url: ${PARALLAX_PLATFORM_WORKER_URL:http://127.0.0.1:8000}
    publish-delay-ms: ${PARALLAX_DISPATCH_PUBLISH_DELAY_MS:500}
    recovery-delay-ms: ${PARALLAX_DISPATCH_RECOVERY_DELAY_MS:5000}
  gateway:
    upstream-base-url: ${PARALLAX_UPSTREAM_URL:http://127.0.0.1:8000}
    connect-timeout-ms: ${PARALLAX_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${PARALLAX_READ_TIMEOUT_MS:30000}
    require-auth: ${PARALLAX_GATEWAY_REQUIRE_AUTH:false}
    admin-secret: ${PARALLAX_GATEWAY_ADMIN_SECRET:}
    internal-token: ${PARALLAX_GATEWAY_INTERNAL_TOKEN:}
  identity:
    # 默认关闭：开启后提交审查需要 API Key 并计入额度。
    # 演示用 compose 档显式打开；生产部署必须打开。
    enabled: ${PARALLAX_IDENTITY_ENABLED:false}
    header-name: ${PARALLAX_IDENTITY_HEADER:X-API-Key}
    key-prefix: ${PARALLAX_IDENTITY_KEY_PREFIX:plx_}
    touch-interval-seconds: ${PARALLAX_IDENTITY_TOUCH_INTERVAL_SECONDS:60}
  jwt:
    secret: ${PARALLAX_JWT_SECRET:}
    access-ttl-minutes: ${PARALLAX_JWT_ACCESS_TTL_MINUTES:720}
  ratelimit:
    enabled: ${PARALLAX_RATELIMIT_ENABLED:true}
    default-capacity: ${PARALLAX_RATELIMIT_DEFAULT_CAPACITY:120}
    default-window-seconds: ${PARALLAX_RATELIMIT_DEFAULT_WINDOW_SECONDS:60}
    # 提交审查会真实消耗模型额度，单独给一个更小的桶
    expensive-capacity: ${PARALLAX_RATELIMIT_EXPENSIVE_CAPACITY:10}
    expensive-window-seconds: ${PARALLAX_RATELIMIT_EXPENSIVE_WINDOW_SECONDS:60}
    # 留空 = 只用单实例内存桶。配了它则多实例共享同一份配额；
    # Redis 不可用时自动降级回内存桶并打 WARN，服务不受影响。
    redis-url: ${PARALLAX_RATELIMIT_REDIS_URL:}
    redis-timeout-ms: ${PARALLAX_RATELIMIT_REDIS_TIMEOUT_MS:250}
    degraded-cooldown-seconds: ${PARALLAX_RATELIMIT_DEGRADED_COOLDOWN_SECONDS:30}
  cache:
    # Read-through caches are optional. Authorization and task state always come from MySQL.
    redis-url: ${PARALLAX_CACHE_REDIS_URL:${PARALLAX_RATELIMIT_REDIS_URL:}}
    ttl-seconds: ${PARALLAX_CACHE_TTL_SECONDS:300}
    lock-wait-ms: ${PARALLAX_CACHE_LOCK_WAIT_MS:100}
    lock-lease-seconds: ${PARALLAX_CACHE_LOCK_LEASE_SECONDS:10}
  webhooks:
    # Empty disables the GitHub webhook endpoint. Set it to the same secret configured in GitHub.
    github-secret: ${PARALLAX_GITHUB_WEBHOOK_SECRET:}
    # Empty disables the GitLab endpoint. Set it to the "Secret token" configured on the GitLab hook.
    gitlab-secret: ${PARALLAX_GITLAB_WEBHOOK_SECRET:}
    max-body-bytes: ${PARALLAX_GITHUB_WEBHOOK_MAX_BODY_BYTES:1000000}
  share:
    default-expiry-seconds: ${PARALLAX_SHARE_DEFAULT_EXPIRY_SECONDS:604800}
    max-expiry-seconds: ${PARALLAX_SHARE_MAX_EXPIRY_SECONDS:2592000}
    max-accesses: ${PARALLAX_SHARE_MAX_ACCESSES:100000}

resilience4j:
  circuitbreaker:
    instances:
      upstream:
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 60
        wait-duration-in-open-state: 20s
        permitted-number-of-calls-in-half-open-state: 3
  retry:
    instances:
      upstreamRead:
        max-attempts: 2
        wait-duration: 200ms
        # 只重试连接阶段的异常：读超时说明上游已经在干活了，重试会白烧一次模型调用
        retry-exceptions:
          - java.net.ConnectException
          - java.net.http.HttpConnectTimeoutException

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  # 显式打开 Prometheus 导出。不写这一行时，本工程的环境里
  # `management.defaults.metrics.export.enabled` 会被当成 false，
  # 于是 `/actuator/prometheus` 直接 404——而 `/actuator` 的链接列表里
  # 也不会出现它，看起来像"没配对"而不是"被条件挡住了"。
  prometheus:
    metrics:
      export:
        enabled: true
  endpoint:
    health:
      probes:
        enabled: true

logging:
  # traceId 必须进每一行日志。没有它，"两端日志能对上同一次请求"就只能靠时间戳猜。
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{traceId:-无}] %logger{32} - %msg%n"
  level:
    dev.parallax.gateway: ${PARALLAX_GATEWAY_LOG_LEVEL:INFO}
