## Parallax · 一键部署
##
## 用法：
##   docker compose --env-file backend/.env up -d          # 只起核心服务
##   docker compose --env-file backend/.env --profile infra up -d   # 连带 Redis / Qdrant
##   docker compose down -v
##
## 为什么用 --env-file 显式指定：模型的 API key 只放在 backend/.env（已被 .gitignore 排除），
## 不在仓库里重复存一份，避免同一个密钥出现在两处、轮换时漏改一个。
## 所有变量都带默认值，因此即使没有 .env 也能起容器（只是无法真正调用模型）。

name: parallax

services:
  api:
    build:
      context: ./backend
    image: parallax-api:0.1.0
    container_name: parallax-api
    environment:
      PARALLAX_LLM_API_KEY: ${PARALLAX_LLM_API_KEY:-${OPENAI_API_KEY:-}}
      PARALLAX_LLM_BASE_URL: ${PARALLAX_LLM_BASE_URL:-${OPENAI_BASE_URL:-https://api.openai.com/v1}}
      PARALLAX_LLM_MODEL: ${PARALLAX_LLM_MODEL:-${OPENAI_MODEL:-gpt-4o-mini}}
      PARALLAX_LLM_REASONING_EFFORT: ${PARALLAX_LLM_REASONING_EFFORT:-}
      PARALLAX_LLM_TIMEOUT_S: ${PARALLAX_LLM_TIMEOUT_S:-90}
      PARALLAX_LLM_MAX_RETRIES: ${PARALLAX_LLM_MAX_RETRIES:-3}
      PARALLAX_LLM_MAX_OUTPUT_TOKENS: ${PARALLAX_LLM_MAX_OUTPUT_TOKENS:-16000}
      PARALLAX_N_READERS: ${PARALLAX_N_READERS:-3}
      PARALLAX_REDUNDANCY: ${PARALLAX_REDUNDANCY:-2}
      PARALLAX_SUPPORT_THRESHOLD: ${PARALLAX_SUPPORT_THRESHOLD:-2}
      PARALLAX_MAX_ROUNDS: ${PARALLAX_MAX_ROUNDS:-3}
      PARALLAX_READER_VISIBILITY: ${PARALLAX_READER_VISIBILITY:-blind}
      PARALLAX_MAX_EVIDENCE_PER_CALL: ${PARALLAX_MAX_EVIDENCE_PER_CALL:-6}
      PARALLAX_RUNS_DIR: /data/runs
      PARALLAX_AUDIT_ROOT: /workspace
      PARALLAX_WORKER_LEASE_SECONDS: ${PARALLAX_WORKER_LEASE_SECONDS:-300}
      PARALLAX_ENABLE_REPRODUCTION: ${PARALLAX_ENABLE_REPRODUCTION:-false}
      PARALLAX_ENABLE_REPAIR: ${PARALLAX_ENABLE_REPAIR:-false}
      PARALLAX_REPRODUCTION_IMAGE: ${PARALLAX_REPRODUCTION_IMAGE:-parallax-repro:local}
      PARALLAX_REPRODUCTION_TIMEOUT_S: ${PARALLAX_REPRODUCTION_TIMEOUT_S:-20}
      PARALLAX_ENABLE_LLM_FALSIFIER: ${PARALLAX_ENABLE_LLM_FALSIFIER:-false}
      PARALLAX_ADAPTIVE_SCHEDULING: ${PARALLAX_ADAPTIVE_SCHEDULING:-false}
      PARALLAX_SEMANTIC_PARTITIONING: ${PARALLAX_SEMANTIC_PARTITIONING:-false}
      PARALLAX_MAX_EVIDENCE_OVERLAP_RATE: ${PARALLAX_MAX_EVIDENCE_OVERLAP_RATE:-1}
      PARALLAX_MIN_INDEPENDENT_SUPPORT: ${PARALLAX_MIN_INDEPENDENT_SUPPORT:-0}
      PARALLAX_GATEWAY_INTERNAL_TOKEN: ${PARALLAX_GATEWAY_INTERNAL_TOKEN:-}
      PARALLAX_WEBHOOK_SECRET: ${PARALLAX_WEBHOOK_SECRET:-}
      # 完成回调：一次审查结束后把 token 用量回报给网关。
      # **默认留空 = 不回调**——脱离网关单独跑 api 时那个地址根本不存在。
      # 走 compose 的 gateway profile 时由 .env 显式打开。
      # 回调失败只记 WARN，绝不让一次成功的审查因此变成失败。
      PARALLAX_CALLBACK_URL: ${PARALLAX_CALLBACK_URL:-}
      PARALLAX_CALLBACK_TOKEN: ${PARALLAX_GATEWAY_INTERNAL_TOKEN:-}
    ports:
      - "${PARALLAX_API_PORT:-8000}:8000"
    volumes:
      - runs:/data/runs
      # 待审查的代码以**只读**方式挂进来。容器只需要读代码，
      # 给写权限没有任何必要，反而扩大了被审查代码的影响面。
      # 提交任务时 repo_path 必须是**容器内可见**的路径，即 /workspace 之下，
      # 例如 /workspace/myrepo（对应宿主机上的 ${PARALLAX_AUDIT_HOST_PATH}/myrepo）。
      - ${PARALLAX_AUDIT_HOST_PATH:-./}:/workspace:ro
    restart: unless-stopped
    init: true

  # 控制台默认通过 /backend 同源代理；服务器端运行时选择 api 或 gateway。
  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_PARALLAX_API: ${PARALLAX_PUBLIC_API:-/backend}
    image: parallax-web:0.1.0
    container_name: parallax-web
    environment:
      PARALLAX_SERVER_API: ${PARALLAX_SERVER_API:-http://api:8000}
    depends_on:
      api:
        condition: service_started
    ports:
      - "${PARALLAX_WEB_PORT:-3000}:3000"
    restart: unless-stopped
    init: true

  # Java 网关：鉴权 / 身份配额 / 运行记录 / 限流 / 熔断 / 白名单转发。
  # 放在 profile 后面——默认 `docker compose up` 只起 api + web，不必等 Java 构建。
  # 需要统一入口时：docker compose --profile gateway up -d
  gateway:
    build:
      context: ./gateway
    image: parallax-gateway:0.1.0
    container_name: parallax-gateway
    profiles: ["gateway"]
    environment:
      PARALLAX_UPSTREAM_URL: http://api:8000
      PARALLAX_GATEWAY_REQUIRE_AUTH: ${PARALLAX_GATEWAY_REQUIRE_AUTH:-false}
      PARALLAX_JWT_SECRET: ${PARALLAX_JWT_SECRET:-}
      PARALLAX_GATEWAY_ADMIN_SECRET: ${PARALLAX_GATEWAY_ADMIN_SECRET:-}
      PARALLAX_GATEWAY_INTERNAL_TOKEN: ${PARALLAX_GATEWAY_INTERNAL_TOKEN:-}
      # 身份与配额：演示档默认**打开**，因为它是网关这一层存在的理由。
      # 打开后提交审查需要 API Key（先调 POST /api/v1/auth/token 拿 JWT 再建 key）。
      PARALLAX_IDENTITY_ENABLED: ${PARALLAX_IDENTITY_ENABLED:-true}
      SPRING_PROFILES_ACTIVE: mysql
      PARALLAX_MYSQL_URL: jdbc:mysql://mysql:3306/${PARALLAX_DB_NAME:-parallax}?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&allowPublicKeyRetrieval=true&sslMode=DISABLED
      PARALLAX_DB_USER: ${PARALLAX_DB_USER:-parallax}
      PARALLAX_DB_PASSWORD: ${PARALLAX_DB_PASSWORD:-parallax}
      # 限流后端。Redis 不可用时网关会自动降级回内存桶，服务不受影响。
      PARALLAX_RATELIMIT_REDIS_URL: redis://redis:6379
    ports:
      - "${PARALLAX_GATEWAY_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_started
      mysql:
        condition: service_healthy
    restart: unless-stopped
    init: true

  # 平台能力的存储：身份、配额、用量账本、运行记录。
  # 与网关同属 gateway profile——网关没有它就起不来，把两者拆到不同 profile
  # 只会制造"起了网关但没有库"这种必然报错的组合。
  mysql:
    image: ${PARALLAX_MYSQL_IMAGE:-mysql:8.4}
    container_name: parallax-mysql
    profiles: ["gateway"]
    environment:
      MYSQL_DATABASE: ${PARALLAX_DB_NAME:-parallax}
      MYSQL_USER: ${PARALLAX_DB_USER:-parallax}
      MYSQL_PASSWORD: ${PARALLAX_DB_PASSWORD:-parallax}
      MYSQL_ROOT_PASSWORD: ${PARALLAX_MYSQL_ROOT_PASSWORD:-local-development-root}
    ports:
      - "127.0.0.1:${PARALLAX_DB_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      # 网关启动就跑 Flyway 迁移；库还没就绪就开跑会直接启动失败。
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP -h 127.0.0.1 -u \"$$MYSQL_USER\" -D \"$$MYSQL_DATABASE\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Redis：网关的分布式限流后端。同时列在 gateway profile 下，
  # 因为"网关多实例共享同一配额"正是 Redis 在这里的唯一职责。
  # Redis 挂掉时网关会自动降级回内存桶，服务不受影响。
  redis:
    image: ${PARALLAX_REDIS_IMAGE:-redis:7-alpine}
    container_name: parallax-redis
    profiles: ["infra", "gateway"]
    command: ["redis-server", "--appendonly", "yes", "--save", ""]
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: parallax-qdrant
    profiles: ["infra"]
    ports:
      - "${PARALLAX_QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  runs:
  redis-data:
  qdrant-data:
  postgres-data:
  mysql-data:
