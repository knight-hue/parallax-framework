name: CI

on:
  push:
    branches: ["main"]
  pull_request:

# 同一分支的新推送取消上一次未完成的运行，省额度也更快看到结果
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Python 测试（${{ matrix.python-version }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: 安装依赖
        working-directory: backend
        run: pip install -e ".[dev]"

      # 测试不需要网络、不需要 API key、也不会调用真实模型：
      # tests/conftest.py 有 autouse 夹具强制清空凭据，从结构上杜绝意外计费。
      - name: 运行测试
        working-directory: backend
        run: pytest

  lint:
    name: Python 静态检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: 安装依赖
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: ruff check
        working-directory: backend
        run: ruff check .

      - name: ruff format 检查
        working-directory: backend
        run: ruff format --check .
  corpus:
    name: 语料完整性
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: 安装依赖
        working-directory: backend
        run: pip install -e ".[dev]"

      # 语料被改动后行号会漂移，而漂移会让召回率**静默**变成 0。
      # 因此把「行号仍精确指向缺陷」做成独立的 CI 门禁，而不是等实验跑完才发现。
      - name: 语料自检
        working-directory: backend
        run: |
          python - <<'PY'
          from pathlib import Path
          from parallax.eval.corpus import load_corpus, verify_task

          tasks = load_corpus(Path("..") / "eval" / "corpus")
          failures = {t.task_id: verify_task(t) for t in tasks}
          bad = {k: v for k, v in failures.items() if v}
          for task in tasks:
              print(f"{task.task_id}: {len(task.ground_truth.defects)} 个缺陷 "
                    f"{'自检通过' if not failures[task.task_id] else '自检失败'}")
          if bad:
              for task_id, problems in bad.items():
                  for problem in problems:
                      print(f"::error::{task_id}: {problem}")
              raise SystemExit(1)
          PY

  mutation:
    name: 语义变异审计
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: 安装依赖
        working-directory: backend
        run: pip install -e ".[dev]"

      # 20 个单点注入缺陷必须全部被现有回归测试杀死；审计在临时副本中运行，
      # 不改动 checkout，也不需要网络或模型凭据。
      - name: 运行 mutation audit
        working-directory: backend
        run: python tools/mutation_audit.py

  gateway:
    name: Java 网关测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # ProxyIntegrationTest 会起一个真实的 HTTP 服务桩当上游，
      # 所以这一步同时验证了协议协商、分块透传、请求头透传与路径白名单。
      #
      # 这一步不跑网关的集成测试（`-Pit`）：它们要 Docker，
      # 而且 Testcontainers 拉真实镜像要几分钟。放在下面独立的 job 里，
      # 这样"逻辑测试失败"和"真实基础设施上失败"能一眼区分开。
      - name: 运行测试
        working-directory: gateway
        run: mvn -B test

  # 真实 PostgreSQL + Redis 上的集成测试。
  #
  # 为什么必须单独存在：默认测试档用的是 H2（PostgreSQL 兼容模式）与内存桶，
  # 它们能让整套测试在没有 Docker 的机器上跑起来，但**不能证伪**以下三件事——
  #   · 迁移在真实 PG 上是否可执行
  #   · `coalesce(sum(bigint), 0)` 在 PG 上返回 numeric 时的映射
  #   · 两个网关实例共享同一份配额，以及 Redis 挂掉后限流降级而服务仍可用
  # 这三条正是"生产级"与"能跑通"之间的差别。
  gateway-it:
    name: Java 网关集成测试（真实 PostgreSQL + Redis）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: 运行集成测试
        working-directory: gateway
        run: mvn -B -Pit verify

      - name: 上传失败时的测试报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gateway-it-reports
          path: gateway/target/failsafe-reports/
          retention-days: 7

  frontend:
    name: 前端检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: ESLint
        working-directory: frontend
        run: npm run lint

      - name: 类型检查
        working-directory: frontend
        run: npm run typecheck

      - name: 构建
        working-directory: frontend
        run: npm run build

  docker:
    name: 镜像构建（${{ matrix.service }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend, gateway]
    steps:
      - uses: actions/checkout@v4

      # compose 配置解析不需要守护进程，能在几秒内抓出 YAML 与变量替换的问题
      - name: 校验 compose 配置
        if: matrix.service == 'backend'
        run: docker compose --profile infra --profile gateway config --quiet

      - uses: docker/setup-buildx-action@v3

      - name: 构建 ${{ matrix.service }} 镜像
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: false
          load: ${{ matrix.service == 'backend' }}
          tags: parallax-${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: 冒烟测试（容器能起来且 /health 可达）
        if: matrix.service == 'backend'
        run: |
          docker run -d --name parallax-ci -p 8000:8000 parallax-backend:ci
          trap 'docker logs parallax-ci; docker rm -f parallax-ci' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health > /dev/null; then
              echo "健康检查通过"; curl -s http://127.0.0.1:8000/health; exit 0
            fi
            sleep 2
          done
          echo "::error::容器启动后 60 秒内 /health 仍不可达"; exit 1
